name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check PBS submission provenance without compute-node Git
        run: python3 tests/test_vanda_submission.py
      - name: Check placement stdout and diagnostic separation
        run: python3 tests/test_placement_logging.py
      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
      - name: Check Vanda node-model helper
        run: |
          set -euo pipefail
          bash -n scripts/vanda_cpu_formal.pbs
          bash -n scripts/vanda_cpu_compare.pbs
          bash -n scripts/vanda_cpu_hybrid.pbs
          bash -n scripts/vanda_cpu_comm_skew.pbs
          bash -n scripts/vanda_cpu_placement.pbs
          bash -n scripts/vanda_cpu_comm_diag.pbs
          bash -n scripts/submit_vanda_cpu_formal.sh
          bash -n scripts/vanda_node_model.sh
          bash -n scripts/vanda_node_topology.sh
          mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:1 -np 1 bash ./scripts/vanda_node_model.sh > node_model.csv
          cat node_model.csv
          awk -F, 'NF != 2 || $1 == "" || $2 == "" {bad=1} END {if (NR != 1 || bad) exit 1}' node_model.csv
      # Hosted runners may expose fewer cores than our 2/4-rank tests need.
      # Sharing cores is for correctness CI only; Vanda timing binds physical cores.
      - name: Unit and MPI correctness checks
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure
          OMP_NUM_THREADS=1 OMP_PLACES=cores OMP_PROC_BIND=close mpirun --map-by slot:PE=1 --bind-to core --host localhost:1 -np 1 ./build/moe_launch_probe --expect-threads 1 --check-affinity
          if OMP_NUM_THREADS=2 OMP_PLACES=cores OMP_PROC_BIND=close mpirun --map-by slot:PE=1 --bind-to core --host localhost:1 -np 1 ./build/moe_launch_probe --expect-threads 2 --check-affinity; then
            echo 'ERROR: overlapping OpenMP threads were accepted'; exit 1
          fi
          ./build/moe_contract_check --tokens 7 --inspect-ranks 4
          ./build/moe_serial --router-mode trace --skew uniform --tokens 2048
          ./build/moe_serial_bench --router-mode trace --skew uniform --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_cpu_bench --parallelism dp --router-mode trace --skew moderate --tokens 17 --dim 4 --hidden 8 --experts 16 > dp_uneven.log
          cat dp_uneven.log
          grep -qx 'benchmark_rank_assignment_histogram=18,16' dp_uneven.log
          test "$(grep -c ',bitwise_ok=1$' dp_uneven.log)" -eq 5
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew extreme --hot-layout A --tokens 2048 --experts 16
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --placement la --communication alltoallv --router-mode trace --skew moderate --hot-layout A --tokens 257 --dim 4 --hidden 8 --experts 16
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --placement la --communication p2p --router-mode trace --skew extreme --tokens 257 --dim 4 --hidden 8 --experts 16
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:4 -np 4 ./build/moe_parallel_check --parallelism ep --placement la --communication p2p --router-mode router --tokens 17 --dim 4 --hidden 8 --experts 16
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_mpi_loopback --router-mode trace --skew uniform --tokens 2048
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --router-mode trace --skew uniform --tokens 2048
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --router-mode trace --skew uniform --tokens 2048 --omp-schedule dynamic
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --router-mode trace --skew moderate --tokens 2048 --omp-schedule dynamic
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 2048 --omp-schedule static
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew moderate --tokens 2048 --omp-schedule dynamic
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 1 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:1 -np 1 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 7 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:4 -np 4 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 7 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=1 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:4 -np 4 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 1 --dim 4 --hidden 8 --experts 2
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 257 --dim 4 --hidden 8 --experts 256
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_cpu_pilot --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_cpu_pilot --parallelism dp --router-mode router --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_cpu_bench --parallelism ep --communication p2p --router-mode trace --skew uniform --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_cpu_bench --parallelism dp --router-mode trace --skew uniform --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism dp --router-mode router --tokens 2048
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism dp --router-mode trace --skew uniform --tokens 17 --dim 4 --hidden 8 --experts 4
          OMP_NUM_THREADS=2 mpirun --map-by slot:OVERSUBSCRIBE --bind-to none --host localhost:2 -np 2 ./build/moe_parallel_check --parallelism ep --router-mode trace --skew uniform --tokens 1 --dim 4 --hidden 8 --experts 4
